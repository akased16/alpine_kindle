name: CI2

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 通过 binfmt_misc 注册 ARM 模拟器，避免 Ubuntu 24.04+ 上
      # qemu-user-static 虚拟包无法安装的问题。
      # 必须放在执行 ARM 二进制的步骤之前。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Build Alpine image
        run: |
          sudo apt update
          sudo apt install -y zip
          chmod +x createv2.sh create_release.sh
          sudo ./createv2.sh
          ./create_release.sh

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine.zip
          path: alpine.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: alpine.zip
          path: .

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ env.date }}" \
            --title "Release ${{ env.date }}" \
            --notes "Automated build: minimal Alpine + Chromium + IBus + Onboard (1G image)." \
            alpine.zip
